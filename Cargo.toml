[package]
name = "gxx"
version = "0.1.0"
edition = "2021"
description = "Bilingual (English / Persian) word and grammar notebook"

[[bin]]
name = "gxx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
shlex = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
once_cell = "1"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["glob"] }

[profile.test]
opt-level = 0