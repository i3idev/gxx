[package]
name = "gxx"
version = "0.2.0"
edition = "2021"
description = "Bilingual (English / Persian) word and grammar notebook"

[[bin]]
name = "gxx"
path = "src/main.rs"

[dependencies]
ctrlc = "3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
shlex = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
once_cell = "1"
dirs = "5"
ort = { version = "2.0.0-rc.13", features = ["api-17"] }
espeak-ng = { version = "0.2", features = ["bundled-data"] }
hound = "3"
rubato = "5.0.1"
ndarray = "0.17"
audioadapter-buffers = "5.2"
clap = { version = "4.5", features = ["derive", "help", "usage", "color", "env", "wrap_help", "std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["glob"] }

[profile.test]
opt-level = 0
