name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Verify CLI help
        run: cargo run --quiet -- --help

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Stage release asset
        shell: pwsh
        run: |
          $asset = "gxx-v${{ steps.version.outputs.version }}-windows-x86_64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/gxx.exe" "dist/$asset"
          if (-not (Test-Path "dist/$asset") -or (Get-Item "dist/$asset").Length -eq 0) {
            throw "Windows release asset is missing or empty"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxx-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --locked

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-gnu/release/gxx
          test -s target/x86_64-unknown-linux-gnu/release/gxx
          ldd target/x86_64-unknown-linux-gnu/release/gxx

      - name: Stage release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="gxx-v${VERSION}-linux-x86_64"
          mkdir -p dist
          cp "target/x86_64-unknown-linux-gnu/release/gxx" "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          test -s "dist/${ASSET}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxx-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-debian:
    name: Build Debian package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --locked

      - name: Build Debian package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKGROOT="gxx_${VERSION}_amd64"
          mkdir -p "${PKGROOT}/DEBIAN" "${PKGROOT}/usr/bin"
          cp "target/x86_64-unknown-linux-gnu/release/gxx" "${PKGROOT}/usr/bin/gxx"
          chmod 0755 "${PKGROOT}/usr/bin/gxx"
          cat > "${PKGROOT}/DEBIAN/control" <<EOF
          Package: gxx
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: gxx maintainers
          Depends: libc6 (>= 2.38), libstdc++6, libgcc-s1
          Description: Bilingual (English / Persian) word and grammar notebook
           gxx is a local, offline-first CLI for managing bilingual
           vocabulary and grammar notes with text-to-speech support.
          Homepage: https://github.com/i3idev/gxx
          EOF
          dpkg-deb --build --root-owner-group "${PKGROOT}" "gxx_${VERSION}_amd64.deb"

      - name: Verify Debian package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="gxx_${VERSION}_amd64.deb"
          dpkg-deb --info "$PKG"
          dpkg-deb --contents "$PKG"
          dpkg-deb -f "$PKG" Architecture | grep -qx amd64
          rm -rf debian-extract
          mkdir debian-extract
          dpkg-deb -x "$PKG" debian-extract
          test -x "debian-extract/usr/bin/gxx"
          "debian-extract/usr/bin/gxx" --help >/dev/null

      - name: Stage release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "gxx_${VERSION}_amd64.deb" "dist/gxx_${VERSION}_amd64.deb"
          test -s "dist/gxx_${VERSION}_amd64.deb"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxx-debian-amd64
          path: dist/*
          if-no-files-found: error

  build-macos-aarch64:
    name: Build macOS Apple Silicon
    needs: validate
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin --locked

      - name: Verify binary
        run: |
          file target/aarch64-apple-darwin/release/gxx
          test -s target/aarch64-apple-darwin/release/gxx

      - name: Stage release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="gxx-v${VERSION}-macos-aarch64"
          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/gxx" "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          test -s "dist/${ASSET}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxx-macos-aarch64
          path: dist/*
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS Intel
    needs: validate
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin --locked

      - name: Verify binary
        run: |
          file target/x86_64-apple-darwin/release/gxx
          test -s target/x86_64-apple-darwin/release/gxx

      - name: Stage release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="gxx-v${VERSION}-macos-x86_64"
          mkdir -p dist
          cp "target/x86_64-apple-darwin/release/gxx" "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          test -s "dist/${ASSET}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxx-macos-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - validate
      - build-windows
      - build-linux
      - build-debian
      - build-macos-aarch64
      - build-macos-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify expected release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cd release-assets
          ls -la
          for asset in \
            "gxx-v${VERSION}-windows-x86_64.exe" \
            "gxx-v${VERSION}-linux-x86_64" \
            "gxx_${VERSION}_amd64.deb" \
            "gxx-v${VERSION}-macos-aarch64" \
            "gxx-v${VERSION}-macos-x86_64"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          sha256sum gxx-v*-windows-x86_64.exe \
            gxx-v*-linux-x86_64 \
            gxx_*_amd64.deb \
            gxx-v*-macos-aarch64 \
            gxx-v*-macos-x86_64 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Ensure release does not already exist
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes "Release $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
